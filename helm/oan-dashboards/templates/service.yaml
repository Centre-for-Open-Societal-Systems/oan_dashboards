apiVersion: v1
kind: Service
metadata:
  name: {{ include "oan-dashboards.fullname" . }}
  labels:
    {{- include "oan-dashboards.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "oan-dashboards.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
