# The dashboards need no Kubernetes API access: an own ServiceAccount without a
# mounted token, rather than the namespace's shared default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oan-dashboards.serviceAccountName" . }}
  labels:
    {{- include "oan-dashboards.labels" . | nindent 4 }}
automountServiceAccountToken: false
