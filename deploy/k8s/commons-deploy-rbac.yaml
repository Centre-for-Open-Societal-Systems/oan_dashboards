# Let far:farmer-ci deploy the OAN dashboards into `commons`. Apply once per
# cluster (dev and staging), as the CLUSTER ADMIN, before the first deploy:
#
#   sudo KUBECONFIG=/etc/rancher/rke2/rke2.yaml kubectl apply -f deploy/k8s/commons-deploy-rbac.yaml
#
# This is the only object the pipeline cannot create itself: farmer-ci cannot
# grant itself rights. Everything else (the ECR pull secret and its refresher,
# the Gateway and VirtualService) belongs to the Helm release.
#
# `commons` also holds the shared platform's credentials (Keycloak admin,
# Postgres superuser, Redis), so this is deliberately NOT the namespace `admin`
# role that farmer-ci has in `far`. It covers only the object types the chart
# and the pipeline use:
#   - no read access to Secrets: farmer-ci may create a Secret and manage the
#     release's own pull secret by name, nothing else. Helm keeps its release
#     records in ConfigMaps (HELM_DRIVER=configmap in the Jenkinsfile).
#   - no pods/exec or port-forward: the smoke test goes through the API
#     server's proxy to the dashboards Service only.
# Residual risk: anyone allowed to create workloads in a namespace can mount
# that namespace's Secrets into a pod. Treat the farmer-ci kubeconfigs as
# having that reach.
#
# Check (all "yes", the last "no"):
#   A=--as=system:serviceaccount:far:farmer-ci
#   kubectl auth can-i create deployments -n commons $A
#   kubectl auth can-i create gateways.networking.istio.io -n commons $A
#   kubectl auth can-i get services/oan-dashboards:http --subresource=proxy -n commons $A
#   kubectl auth can-i get secrets -n commons $A
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oan-dashboards-deploy
  namespace: commons
rules:
  # The release's workloads and their hooks
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Helm release records (HELM_DRIVER=configmap)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # helm --wait, kubectl rollout status, troubleshooting
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # The ECR refresher's Role and RoleBinding (it can grant only rules listed here)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Secrets: create (the pull secret's first write), and the pull secret by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["oan-dashboards-ecr"]
    verbs: ["get", "update", "patch", "delete"]
  # Public routing
  - apiGroups: ["networking.istio.io"]
    resources: ["gateways", "virtualservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Smoke test through the API server proxy, to the dashboards Service only
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["oan-dashboards", "oan-dashboards:http", "oan-dashboards:80"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: farmer-ci-oan-dashboards-deploy
  namespace: commons
subjects:
  - kind: ServiceAccount
    name: farmer-ci
    namespace: far
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oan-dashboards-deploy
