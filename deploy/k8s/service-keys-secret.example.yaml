# API keys the OAN dashboards present to the services' Kong gateways, as the
# `apikey` header (Kong consumer `oan-dashboards`, group `dashboards`). The release
# mounts this Secret optionally (values: serviceKeysSecret), so it can be created
# before or after the gateways start enforcing keys.
#
# Created once per cluster by an admin, like commons-deploy-rbac.yaml: the deploy
# role may create a Secret but cannot update one, so the pipeline never manages it.
# Never commit real values. Create it from the secret store instead, e.g.:
#
#   kubectl -n commons create secret generic oan-dashboards-service-keys \
#     --from-literal=A2C_DASHBOARD_API_KEY="$A2C_KEY" \
#     --from-literal=GRIEVANCE_DASHBOARD_API_KEY="$GRIEVANCE_KEY"
#
# Each key must equal the one the service's gateway was synced with
# (DECK_OAN_DASHBOARDS_API_KEY in that service's `deck sync`). Rotate by updating
# both, then restarting the deployment (envFrom is read at start).
apiVersion: v1
kind: Secret
metadata:
  name: oan-dashboards-service-keys
  namespace: commons
type: Opaque
stringData:
  A2C_DASHBOARD_API_KEY: REPLACE_FROM_SECRET_STORE
  GRIEVANCE_DASHBOARD_API_KEY: REPLACE_FROM_SECRET_STORE
